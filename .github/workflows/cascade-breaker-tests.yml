name: Cascade Breaker tests

on:
  push:
    branches: [main]
    paths:
      - "factory/cascade-breaker/**"
      - ".github/workflows/cascade-breaker-tests.yml"
  pull_request:
    paths:
      - "factory/cascade-breaker/**"
      - ".github/workflows/cascade-breaker-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factory/cascade-breaker
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest 'pydantic>=2,<3'
      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Check fail-closed scenario runner
        env:
          PYTHONPATH: .
        run: python -m src.orchestrator
